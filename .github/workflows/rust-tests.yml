name: Rust Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

jobs:
  cargo-test:
    name: Cargo test
    runs-on: windows-latest

    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      # Analyzer provenance and update policy: docs/reachability-gate.md
      - name: Verify vendored codegraph
        working-directory: ${{ github.workspace }}
        run: python tools/codegraph/verify_vendor.py

      # Reachability policy and rationale: docs/reachability-gate.md
      - name: Reachability
        working-directory: ${{ github.workspace }}
        run: python tools/codegraph/ci_gate.py --lang rs --root .

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: ./src-tauri -> target

      - name: Cargo check tests
        run: cargo check --tests

      - name: Cargo clippy
        run: cargo clippy

      - name: Cargo test
        run: cargo test
