[package]
name = "hive-manager"
version = "0.71.0"
description = "Multi-agent orchestration and monitoring for Claude Code workflows"
authors = ["RDuff"]
edition = "2021"

[lib]
name = "hive_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
regex = "1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
notify = "6.1"
tempfile = "3"
fs2 = "0.4"
sha2 = "0.10.9"
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
anyhow = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }
